# Smithery configuration for JUCESP: NIRE a partir de Sócio
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_jucesp_nire_socio

name: jucesp_nire_socio-mcp
displayName: "JUCESP: NIRE a partir de Sócio"
description: >
  Encontra empresas na JUCESP a partir de um sócio (nome, CPF ou CNPJ), retornando o NIRE de cada participação. Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/jucesp_nire_socio-mcp
repository: https://github.com/mcp-dir/jucesp_nire_socio-mcp

tags:
  - jucesp_nire_socio
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_jucesp_nire_socio

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_jucesp_nire_socio/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
